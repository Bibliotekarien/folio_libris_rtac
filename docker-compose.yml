name: folio_libris_rtac

services:
  rtac:
    build: .
    image: folio-libris-rtac:latest
    container_name: rtac
    # Fronted by the shared `edge` Caddy container (separate stack). Caddy joins
    # this stack's `proxy` network and reverse-proxies to http://rtac:5000 by
    # container name — that, not a host port, is how requests reach the app.
    # The localhost publish below is only for host-side debugging (curl on the
    # box); drop it if you don't want the app reachable on the host at all.
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - proxy
    # Trust the reverse proxy's X-Forwarded-* headers.
    command:
      - uvicorn
      - application:application
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    # Logging is opt-in and passed straight through from .env; both are empty
    # by default, which leaves the app's logging exactly as it was. Set
    # LOG_FORMAT=json for one JSON line per record, tagged with the library's
    # sigel (see README.md, "Structured logs").
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    # Per-library settings (with FOLIO credentials) are mounted read-only,
    # so secrets stay out of the image and can be managed on the host.
    volumes:
      - ./libraries:/app/libraries:ro
    restart: unless-stopped
    # Cap resources so a flood of requests can't exhaust the host.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/').status==200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Docker names this `folio_libris_rtac_proxy` (project name + `_proxy`). The
  # edge Caddy stack joins it as an external network to reach the `rtac`
  # container. Keep the project name (top of file) stable so the name matches
  # what edge/docker-compose.yml references.
  proxy:
    driver: bridge
